name: deploy-web

# Publishes the Expo web export to GitHub Pages at /college-rankings. Pages must be enabled once
# (Settings > Pages > Source: GitHub Actions); on a free plan that needs a public repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # copy-snapshot, expo export with WEB_BASE_URL=/college-rankings, 404.html + .nojekyll
      - run: pnpm export:web
        env:
          WEB_BASE_URL: /college-rankings
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    # Enable Pages before requesting a deployment manually.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
