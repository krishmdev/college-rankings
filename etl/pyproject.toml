[project]
name = "college-etl"
version = "0.1.0"
description = "Builds the college-rankings dataset snapshot from College Scorecard, IPEDS (Urban Institute), NSF HERD and Campus Labs Engage."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "polars==1.44.2",
    "pydantic==2.13.5",
    "typer==0.27.2",
    "rich==15.0.0",
    "tenacity==9.1.4",
    "rapidfuzz==3.14.6",
]

[project.scripts]
college-etl = "college_etl.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/college_etl"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Frozen dataclass defaults and typer options are fine as argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
